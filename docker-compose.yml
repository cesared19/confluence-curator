services:
  curator:
    build: .
    environment:
      # El asistente de configuración guarda aquí, en el volumen, para que sobreviva a las actualizaciones.
      CURATOR_ENV_FILE: /data/config.env
      # El asistente solo se abre desde este equipo: el puerto se publica únicamente en 127.0.0.1.
      CURATOR_SETUP_OPEN: "1"
    volumes:
      - curator-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    # Permite usar Ollama instalado en el mismo equipo: OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  curator-data:
